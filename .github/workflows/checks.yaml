# Quick checks: type-check and build the frontend, compile the backend on every platform
# and run its tests. (The Stream Deck plugin and the Android app have their own branches and
# checks: streamdeck/develop, android/develop.) They run on pull requests, and on
# develop and main after each merge (so the release pull requests the bot opens have them
# too: its own pull requests don't start workflows). Installers are built by build.yaml
# (develop) and release.yaml (main).
name: Checks

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

# A new push to the same pull request cancels the checks still running for the old one.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Release scripts
        run: node --test scripts/release/lib.test.mjs

  backend:
    name: Backend (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'macos-latest'
            os_name: 'macos'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libudev-dev \
            libasound2-dev

      # Compiling only needs the frontend folder and the ffmpeg sidecar to exist; the real
      # ones come with the full build.
      - name: Stand-ins for the frontend and ffmpeg
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><title>OpenPres</title>' > dist/index.html
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p tauri/binaries
          touch "tauri/binaries/ffmpeg-${triple}${ext}"

      - name: Compile
        working-directory: tauri
        run: cargo check --all-targets --locked

      - name: Unit tests
        if: matrix.os_name == 'linux'
        working-directory: tauri
        run: cargo test --lib --locked
