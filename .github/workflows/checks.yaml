# Quick checks for pull requests: type-check and build the frontend, compile the backend on
# every platform and run its tests, and test the Stream Deck plugin. The full app
# (installers, bundled ffmpeg) is only built after merging (build.yaml).
name: Checks

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# A new push to the same pull request cancels the checks still running for the old one.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci

      - name: Type-check and build
        run: npm run build

  streamdeck:
    name: Stream Deck plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: streamdeck/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Builds the plugin, then runs it with a fake Stream Deck app and a stand-in OpenPres.
      - name: Build and test
        run: npm test

      - name: Validate with Elgato's CLI
        run: npm run validate

  backend:
    name: Backend (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'macos-latest'
            os_name: 'macos'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libudev-dev \
            libasound2-dev

      # Compiling only needs the frontend folder and the ffmpeg sidecar to exist; the real
      # ones come with the full build.
      - name: Stand-ins for the frontend and ffmpeg
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><title>OpenPres</title>' > dist/index.html
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p tauri/binaries
          touch "tauri/binaries/ffmpeg-${triple}${ext}"

      - name: Compile
        working-directory: tauri
        run: cargo check --all-targets --locked

      - name: Unit tests
        if: matrix.os_name == 'linux'
        working-directory: tauri
        run: cargo test --lib --locked
