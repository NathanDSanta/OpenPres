# Publishes a release (docs/RELEASING.md). The same in every OpenPres repository; only the
# build job is this repository's own: the server for every computer (package.yaml), with the
# Manager's web build inside, signed update bundles, latest.json and the beta feed.
#   stable  X.Y.Z when main gets something: /release on Telegram (develop into main, Y+1) or
#           /hotfix (a hotfix pull request, Z+1). After a hotfix, main goes back into develop
#           and a beta follows straight away, so betas have the fix too.
#   beta    X.Y.Z.A from develop, when beta.yaml says it's time (a pre-release on GitHub).
# A major release (X+1): run this workflow by hand on main with "major", only when Nathan asks.
name: Release

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:
    inputs:
      bump:
        description: "On main: major makes a major release (X+1.0.0), only when Nathan asks for one"
        type: choice
        options: [ auto, major ]
        default: auto

env:
  PRODUCT: "OpenPres"
  FIRST_VERSION: "0.6.0"

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
      tag: ${{ steps.plan.outputs.tag }}
      semver: ${{ steps.plan.outputs.semver }}
      code: ${{ steps.plan.outputs.code }}
      beta: ${{ steps.plan.outputs.beta }}
      hotfix: ${{ steps.plan.outputs.hotfix }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Stable from main, beta from develop (beta.yaml already decided that one is due).
      - name: Version and notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_REF: origin/main
          BUMP: ${{ inputs.bump == 'major' && 'major' || '' }}
          NOW: "true"
        run: node scripts/release/plan.mjs ${{ github.ref_name == 'main' && 'stable' || 'beta' }}

      - name: Summary
        env:
          NAME: ${{ steps.plan.outputs.name }}
        run: echo "${NAME:-Nothing to release.}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/package.yaml
    with:
      ref: ${{ github.sha }}
      # Betas are carried as X.Y.(Z+1)-A, which sorts between the stables (docs/RELEASING.md).
      version: ${{ needs.plan.outputs.semver }}
      name_version: ${{ needs.plan.outputs.version }}
      platforms: all
      beta: ${{ needs.plan.outputs.beta == 'true' }}
      updater: true
    secrets: inherit

  publish:
    name: Publish
    needs: [ plan, build ]
    if: ${{ !cancelled() && needs.plan.outputs.version != '' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      NAME: ${{ needs.plan.outputs.name }}
      BETA: ${{ needs.plan.outputs.beta }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The installers (OpenPres-<version>-*), their checksums and update signatures.
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenPres-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v4
        with:
          pattern: update-signatures-*
          merge-multiple: true
          path: sigs

      # latest.json: where installed servers find the new version and its signed bundles.
      - name: Update file
        env:
          SEMVER: ${{ needs.plan.outputs.semver }}
        run: |
          mkdir -p sigs
          if RELEASE_NOTES="$NOTES" node scripts/release/updater-json.mjs "$SEMVER" sigs "$GITHUB_REPOSITORY" "$TAG" > latest.json; then
            cat latest.json
          else
            rm -f latest.json
            echo "::warning::No signed update bundles (TAURI_SIGNING_PRIVATE_KEY isn't set?): installed servers won't see this release."
          fi

      - name: Publish on GitHub
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls release > names.txt
          {
            if [ "$BETA" = "true" ]; then echo "A **beta**: for the servers following the beta program (Settings → System)."; echo; fi
            # What to download for which computer.
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { downloadsTable } from "./scripts/release/assets.mjs";
              const names = readFileSync("names.txt", "utf8").split("\n").filter(Boolean);
              const url = (n) => `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${encodeURIComponent(n)}`;
              const table = downloadsTable(names, url);
              if (table) console.log(`${table}\n`);
            '
            printf '%s\n' "$NOTES"
          } > notes.md
          if [ -f latest.json ]; then cp latest.json release/; fi
          flags=()
          if [ "$BETA" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$PRODUCT $NAME" --notes-file notes.md "${flags[@]}"
          echo "Published **$PRODUCT $NAME**." >> "$GITHUB_STEP_SUMMARY"

      # Servers in the beta program read this fixed release's latest.json: every release
      # replaces it, so they get betas and the stables after them.
      - name: Beta feed
        if: ${{ hashFiles('latest.json') != '' }}
        run: |
          if ! gh release view beta-feed --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create beta-feed --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Beta feed" --notes "Not a release: the newest version for the beta program (latest.json). Betas and stable releases are listed on the Releases page."
          fi
          gh release upload beta-feed latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Bring the hotfix into develop, and a beta with it
        if: needs.plan.outputs.hotfix == 'true'
        run: |
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/merges" -f base=develop -f head=main -f commit_message="Merge branch 'main' into develop (hotfix $NAME)" > /dev/null; then
            echo "::error::Couldn't merge main into develop (a conflict?). Merge it by hand, then run the Beta workflow with 'now', so betas get the fix."
            exit 1
          fi
          gh workflow run beta.yaml --repo "$GITHUB_REPOSITORY" --ref develop -f now=true
          echo "Merged main into develop; a beta with the fix is on its way." >> "$GITHUB_STEP_SUMMARY"
