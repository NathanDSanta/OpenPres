# Publishes a release (see docs/RELEASING.md) when main gets something new to release: the
# "Release vX.Y.Z" pull request from develop (merged by hand, or by release-pr.yaml when
# enough has piled up), or a hotfix. The version comes from the pull requests merged since
# the last release (feat: minor, fix/perf: patch, breaking: major). It's tagged, built for
# Windows, macOS and Linux (package.yaml), and published on GitHub Releases with clearly
# named installers, SHA256SUMS.txt and latest.json, which installed apps check for updates.
#
# Run it by hand with a tag (Actions → Release → Run workflow) to build that release again,
# e.g. after a build failed: its draft's files are replaced, then it's published.
name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Build this existing release again (e.g. v0.4.0). Empty: release what's new in main."
        type: string
        default: ''

# One release at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version || steps.again.outputs.version }}
      tag: ${{ steps.plan.outputs.tag || steps.again.outputs.tag }}
      hotfix: ${{ steps.plan.outputs.hotfix || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Released from main (a run by hand from another branch still releases main).
          ref: ${{ inputs.tag == '' && 'main' || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: What changed since the last release
        id: plan
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/plan.mjs release

      - name: Nothing to release
        if: inputs.tag == '' && steps.plan.outputs.version == ''
        run: echo "Only changes that don't need a new version (docs, CI, chores) since ${{ steps.plan.outputs.base }}." >> "$GITHUB_STEP_SUMMARY"

      # The tag and a draft release; the release is published once every build is in.
      - name: Tag and draft the release
        if: inputs.tag == '' && steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.plan.outputs.notes }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          sha="$(git rev-parse HEAD)"
          git tag "$TAG" "$sha"
          git push origin "$TAG"
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" --draft --title "OpenPres ${TAG#v}" --notes-file notes.md --target "$sha"
          echo "Releasing **$TAG** (${{ steps.plan.outputs.bump }})" >> "$GITHUB_STEP_SUMMARY"

      # Building a release again: its draft loses the old files (they're all rebuilt).
      - name: Get the release to build again
        id: again
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "::error::There's no tag $TAG."; exit 1; }
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "OpenPres ${TAG#v}" --notes "" --verify-tag
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building **$TAG** again" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/package.yaml
    with:
      ref: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
      platforms: all
      release_tag: ${{ needs.plan.outputs.tag }}
      updater: true
    secrets: inherit

  streamdeck:
    name: Stream Deck plugin
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: streamdeck/package-lock.json

      - name: Pack the plugin
        working-directory: streamdeck
        run: npm ci && npm run pack

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          name="OpenPres-${TAG#v}-StreamDeck-Plugin.streamDeckPlugin"
          cp streamdeck/dist/com.nathandsanta.openpres.streamDeckPlugin "$name"
          sha256sum "$name" > SHA256SUMS-streamdeck.txt
          gh release upload "$TAG" "$name" --clobber
          gh release upload "$TAG" SHA256SUMS-streamdeck.txt --clobber

  publish:
    name: Publish
    needs: [ plan, build, streamdeck ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get the builds' checksums
        uses: actions/download-artifact@v4
        with:
          path: from-builds
          pattern: checksums-*

      - name: Get the update signatures
        uses: actions/download-artifact@v4
        with:
          path: from-builds
          pattern: update-signatures-*

      # One SHA256SUMS.txt for every file people download.
      - name: Checksums
        run: |
          gh release download "$TAG" --pattern 'SHA256SUMS-streamdeck.txt' --dir from-builds || true
          cat $(find from-builds -name 'SHA256SUMS-*.txt' | sort) | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release delete-asset "$TAG" SHA256SUMS-streamdeck.txt --yes || true

      # latest.json: where installed apps find the new version and its signed bundles.
      - name: Update manifest
        run: |
          mkdir sigs
          find from-builds -path '*update-signatures-*' -name '*.sig' -exec cp {} sigs/ \;
          if ls sigs/*.sig > /dev/null 2>&1; then
            export RELEASE_NOTES="$(gh release view "$TAG" --json body --jq .body)"
            node scripts/release/updater-json.mjs "${TAG#v}" sigs "$GITHUB_REPOSITORY" "$TAG" > latest.json
            cat latest.json
            gh release upload "$TAG" latest.json --clobber
          else
            echo "::warning::No signed update bundles: installed apps won't update to $TAG by themselves."
          fi

      # The notes get a table of what to download for which computer.
      - name: Downloads in the notes
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          gh release view "$TAG" --json assets --jq '.assets[].name' > names.txt
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { downloadsTable } from "./scripts/release/assets.mjs";
            const names = readFileSync("names.txt", "utf8").split("\n").filter(Boolean);
            const url = (n) => `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${encodeURIComponent(n)}`;
            // Built again: the old table goes.
            const notes = readFileSync("notes.md", "utf8").replace(/<!-- downloads -->[\s\S]*?<!-- \/downloads -->\s*/, "").trim();
            const table = downloadsTable(names, url);
            writeFileSync("notes.md", `${table ? `<!-- downloads -->\n${table}\n<!-- /downloads -->\n\n` : ""}${notes}\n`);
          '
          gh release edit "$TAG" --notes-file notes.md

      # Only the newest version is "Latest" (latest.json is read from it): building an older
      # release again doesn't send installed apps back to it.
      - name: Publish the release
        run: |
          newest="$(git ls-remote --tags --refs origin 'v*.*.*' | sed 's#.*refs/tags/##' | sort -V | tail -1)"
          if [ "$newest" = "$TAG" ]; then latest="--latest"; else latest="--latest=false"; fi
          gh release edit "$TAG" --draft=false "$latest"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # A hotfix went straight into main: develop needs it too.
      - name: Bring the hotfix into develop
        if: needs.plan.outputs.hotfix == 'true'
        run: |
          existing="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already brings main into develop."
          else
            gh pr create --base develop --head main \
              --title "chore: bring hotfix $TAG into develop" \
              --body "The hotfix released as $TAG went straight into main. Merging this brings it into develop, so the next release keeps it." \
              || echo "::error::Couldn't open the pull request. In Settings → Actions → General, allow GitHub Actions to create pull requests (see docs/RELEASING.md)."
          fi
