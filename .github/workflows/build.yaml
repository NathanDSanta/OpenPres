# Test builds of what's in develop, to try before releasing: after each merge into develop,
# or by hand from the Actions tab for any branch (choose "all" for every platform). Their
# files are under the run's Artifacts, named like the release's
# (OpenPres-0.4.0-test.1a2b3c4-Windows-x64-Setup.exe). Releases are built by release.yaml.
name: Build Tauri App

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      platforms:
        description: "main (Windows x64, macOS Apple Silicon, Linux x64) or all"
        type: choice
        options: [ main, all ]
        default: main

# When several merges land close together, only the newest one is built.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  name:
    name: Name the build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "version=$(node -p "require('./tauri/tauri.conf.json').version")-test.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: name
    permissions:
      contents: write
    uses: ./.github/workflows/package.yaml
    with:
      ref: ${{ github.sha }}
      name_version: ${{ needs.name.outputs.version }}
      platforms: ${{ inputs.platforms || 'main' }}

  # The Stream Deck plugin, ready to install (double-click it, or "Install from file" in OpenDeck).
  streamdeck-plugin:
    name: Stream Deck plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: streamdeck/package-lock.json

      - run: npm ci

      - name: Pack the plugin
        run: npm run pack

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: openpres-streamdeck-plugin
          path: streamdeck/dist/com.nathandsanta.openpres.streamDeckPlugin
          if-no-files-found: error
